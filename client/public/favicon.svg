<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded squircle - Solid Terracotta -->
  <rect width="64" height="64" rx="16" fill="#C76D4A" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Balanced C-curved opening parenthesis / monogram (Left) -->
  <path
    d="M 34 15 C 20.4 15 13 23.2 13 32 C 13 40.8 20.4 49 34 49"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="6.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Precision twin eye dots ":" (Right) -->
  <circle cx="47" cy="22.4" r="4.2" fill="#FFFFFF" />
  <circle cx="47" cy="41.6" r="4.2" fill="#FFFFFF" />
</svg>

